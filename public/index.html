      height: 18px;
      background: linear-gradient(135deg, #fb7185 0%, #fbbf24 100%);
      animation: finclass-pulse 1.4s ease-in-out infinite;
    }

    @keyframes finclass-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes finclass-pulse {

        transform: scale(0.9);
        opacity: 0.75;
